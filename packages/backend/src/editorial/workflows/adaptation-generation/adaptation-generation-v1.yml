    - data:
        code: |+
          import json

          def main(editorial_json, state):
              payload = {'editorial_json': editorial_json, 'state': state}
              result = json.loads(runtime_main('review_request', json.dumps(payload, ensure_ascii=False)))["result"]
              def encode(value):
                  rendered = json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(',', ':'))
                  if len(rendered.encode('utf-8')) > 750000:
                      raise ValueError('ADAPTATION_CODE_OUTPUT_LIMIT')
                  return rendered
              return {
                  'state_json': encode(result['state']),
                  'request_json': encode(result.get('request', {})),
                  'repair_required': int(result.get('repair_required', 0)),
                  'status': result.get('status', result['state'].get('status', 'running')),
                  'adaptation_json': result.get('adaptation_json', ''),
                  'adaptation_report': result.get('adaptation_report', ''),
              }

          """Provider-free controller for the shared M4.2 channel generation workflow.

          The model selects text segments and their approved claim/evidence references.
          This module validates those references, derives all UTF-16 offsets, bounds one
          targeted repair, and emits only an unapproved candidate plus its review report.
          """
          import copy
          import hashlib
          import json
          import re
          import uuid

          MAX_INPUT_BYTES = 350_000
          MAX_OUTPUT_BYTES = 360_000
          MAX_CODE_OUTPUT_BYTES = 750_000
          MAX_PARAGRAPHS = 20
          MAX_SEGMENTS = 100
          MAX_ISSUES = 30
          MAX_BODY_UTF16 = {"TELEGRAM_POST": 4_096, "LINKEDIN_TEXT": 10_000,
                            "LINKEDIN_COVER": 10_000, "INSTAGRAM_COVER": 10_000,
                            "LINKEDIN_CAROUSEL": 10_000, "INSTAGRAM_CAROUSEL": 10_000,
                            "INSTAGRAM_STORIES": 10_000}
          MAX_COVER_TEXT_UTF16 = 200
          MAX_COVER_INSTRUCTION = 2_000
          MAX_SCRIPT_FRAMES = 30
          MAX_SCRIPT_FRAME_TEXT_UTF16 = 3_000
          MAX_SCRIPT_TEXT_UTF16 = 30_000
          MAX_SCRIPT_MAPPINGS = 100
          MAX_SCRIPT_BYTES = 200_000
          MAX_SCRIPT_PURPOSE = 200
          MAX_SCRIPT_VISUAL_HINT = 1_000
          MAX_SCRIPT_TRANSITION = 300
          REPORT_SCHEMA = "adaptation-editorial-report-v1"
          FORMATS = frozenset(MAX_BODY_UTF16)
          COVER_FORMATS = frozenset(("LINKEDIN_COVER", "INSTAGRAM_COVER"))
          SCRIPT_FORMATS = frozenset(("LINKEDIN_CAROUSEL", "INSTAGRAM_CAROUSEL", "INSTAGRAM_STORIES"))
          STORY_FORMATS = frozenset(("INSTAGRAM_STORIES",))


          def fail(code: str) -> None:
              raise ValueError("ADAPTATION_WORKFLOW_" + code)


          def dumps(value: object, *, sort_keys: bool = False) -> str:
              return json.dumps(value, ensure_ascii=False, separators=(",", ":"), sort_keys=sort_keys, allow_nan=False)


          def digest_text(value: str) -> str:
              return hashlib.sha256(value.encode("utf-8")).hexdigest()


          def digest_output(value: object) -> str:
              # Preserve schema insertion order to match JSON.stringify on the backend.
              return digest_text(dumps(value))


          def load(value: object) -> object:
              if not isinstance(value, str):
                  return copy.deepcopy(value)
              if len(value.encode("utf-8")) > 2 * 1024 * 1024:
                  fail("JSON_SIZE")

              def pairs(rows):
                  result = {}
                  for key, child in rows:
                      if key in result:
                          fail("DUPLICATE_KEY")
                      result[key] = child
                  return result

              try:
                  return json.loads(value, object_pairs_hook=pairs,
                                    parse_constant=lambda _: fail("JSON_NUMBER"))
              except (json.JSONDecodeError, RecursionError):
                  fail("JSON_INVALID")


          def obj(value: object, required=(), allowed=None) -> dict:
              if not isinstance(value, dict) or any(key not in value for key in required):
                  fail("OBJECT_SHAPE")
              if allowed is not None and set(value) - set(allowed):
                  fail("OBJECT_FIELDS")
              return value


          def text(value: object, maximum: int, *, empty: bool = False) -> str:
              if not isinstance(value, str) or len(value) > maximum or (not empty and not value.strip()):
                  fail("TEXT_SHAPE")
              if re.search(r"[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]", value):
                  fail("TEXT_CONTROL")
              return value


          def rows(value: object, maximum: int, *, minimum: int = 0) -> list:
              if not isinstance(value, list) or not minimum <= len(value) <= maximum:
                  fail("ARRAY_SHAPE")
              return value


          def identifier(value: object) -> str:
              value = text(value, 36)
              try:
                  uuid.UUID(value)
              except (ValueError, AttributeError):
                  fail("REFERENCE_FORMAT")
              return value


          def utf16_len(value: str) -> int:
              return len(value.encode("utf-16-le")) // 2


          def size(value: object, maximum: int, code: str) -> None:
              if len(dumps(value, sort_keys=True).encode("utf-8")) > maximum:
                  fail(code)


          def validate_input(value: object) -> dict:
              e = obj(load(value), ("schemaVersion", "format", "inputMode", "contentMode", "includeLink",
                                    "brief", "style", "claims", "context", "article"))
              size(e, MAX_INPUT_BYTES, "INPUT_SIZE")
              if e["schemaVersion"] != "channel-context-v1" or e["format"] not in FORMATS \
                      or e["inputMode"] not in ("DIRECT", "ARTICLE_DERIVED") \
                      or e["contentMode"] not in ("FACTUAL", "CREATIVE") or type(e["includeLink"]) is not bool:
                  fail("INPUT_CONTRACT")
              if e["format"] != "TELEGRAM_POST" and e["includeLink"]:
                  fail("LINK_OPTION_FORMAT")
              obj(e["brief"])
              obj(e["style"], ("brandbook", "tone", "settings"), ("brandbook", "tone", "settings"))
              text(e["style"]["brandbook"], 20_000, empty=True)
              text(e["style"]["tone"], 10_000, empty=True)
              if not isinstance(e["style"]["settings"], (dict, list, str, type(None))):
                  fail("STYLE_SHAPE")

              if e["inputMode"] == "DIRECT":
                  if e["article"] is not None:
                      fail("INPUT_MODE")
              else:
                  if e["article"] is None:
                      fail("INPUT_MODE")
                  article = obj(e["article"], ("versionId", "sha256", "text"), ("versionId", "sha256", "text"))
                  identifier(article["versionId"])
                  text(article["text"], 300_000)
                  if not isinstance(article["sha256"], str) or not re.fullmatch(r"[a-f0-9]{64}", article["sha256"]):
                      fail("ARTICLE_HASH")

              context_by_snapshot = {}
              for entry in rows(e["context"], 100):
                  entry = obj(entry, ("snapshotId", "purpose", "sha256", "text"),
                              ("snapshotId", "purpose", "sha256", "text"))
                  sid = identifier(entry["snapshotId"])
                  purpose = text(entry["purpose"], 100)
                  content = text(entry["text"], 300_000)
                  if sid in context_by_snapshot or not isinstance(entry["sha256"], str) or entry["sha256"] != digest_text(content):
                      fail("CONTEXT_HASH")
                  context_by_snapshot[sid] = {"snapshotId": sid, "purpose": purpose, "sha256": entry["sha256"], "text": content}

              claim_ids, evidence_ids, allowed_pairs = set(), set(), {}
              for claim in rows(e["claims"], 100):
                  claim = obj(claim, ("claimRevisionId", "wording", "evidence"),
                              ("claimRevisionId", "wording", "evidence"))
                  cid = identifier(claim["claimRevisionId"])
                  text(claim["wording"], 10_000)
                  if cid in claim_ids:
                      fail("DUPLICATE_CLAIM")
                  claim_ids.add(cid)
                  evidence = set()
                  for item in rows(claim["evidence"], 100, minimum=1):
                      item = obj(item, ("evidenceId", "quote", "snapshotId"),
                                 ("evidenceId", "quote", "snapshotId"))
                      eid = identifier(item["evidenceId"])
                      text(item["quote"], 10_000)
                      identifier(item["snapshotId"])
                      if eid in evidence_ids:
                          fail("DUPLICATE_EVIDENCE")
                      evidence_ids.add(eid)
                      evidence.add(eid)
                  allowed_pairs[cid] = evidence

              required_raw = e["brief"].get("requiredClaimRevisionIds", [])
              required = {identifier(v) for v in rows(required_raw, 100)}
              if required - claim_ids:
                  fail("REQUIRED_REFERENCE")
              if e["contentMode"] == "CREATIVE":
                  if claim_ids or required:
                      fail("CREATIVE_EVIDENCE")
              elif not claim_ids:
                  fail("MISSING_BASIS")
              return {"input": e, "allowed": allowed_pairs, "required": sorted(required)}


          def normalize_paragraphs(raw_paragraphs: object, cover_instruction: object, checked: dict) -> tuple[list[dict], str]:
              e = checked["input"]
              paragraphs = rows(raw_paragraphs, MAX_PARAGRAPHS, minimum=1)
              result = []
              segment_count = 0
              seen_cover = False
              body_count = 0
              cover_count = 0
              for index, paragraph in enumerate(paragraphs, 1):
                  paragraph = obj(paragraph, ("field", "segments"), ("field", "segments"))
                  field = paragraph["field"]
                  if field not in ("text", "cover"):
                      fail("PARAGRAPH_FIELD")
                  if field == "cover":
                      if e["format"] not in COVER_FORMATS or seen_cover or index != len(paragraphs):
                          fail("COVER_FIELD")
                      seen_cover = True
                      cover_count += 1
                  elif seen_cover:
                      fail("PARAGRAPH_ORDER")
                  else:
                      body_count += 1

                  segments = []
                  for segment in rows(paragraph["segments"], MAX_SEGMENTS, minimum=1):
                      segment = obj(segment, ("text", "claimRevisionId", "evidenceId"),
                                    ("text", "claimRevisionId", "evidenceId"))
                      value = text(segment["text"], MAX_COVER_TEXT_UTF16 if field == "cover"
                                   else MAX_BODY_UTF16[e["format"]])
                      cid = text(segment["claimRevisionId"], 36, empty=True)
                      eid = text(segment["evidenceId"], 36, empty=True)
                      if e["contentMode"] == "CREATIVE":
                          if cid or eid:
                              fail("CREATIVE_MAPPING")
                      elif not cid or not eid or eid not in checked["allowed"].get(cid, set()):
                          fail("EVIDENCE_REFERENCE")
                      segment_count += 1
                      if segment_count > MAX_SEGMENTS:
                          fail("SEGMENT_LIMIT")
                      segments.append({"text": value, "claimRevisionId": cid, "evidenceId": eid})
                  result.append({"paragraphId": f"p{index}", "field": field, "segments": segments})

              if body_count < 1:
                  fail("BODY_REQUIRED")
              if e["format"] in COVER_FORMATS:
                  if cover_count != 1:
                      fail("COVER_REQUIRED")
                  instruction = text(cover_instruction, MAX_COVER_INSTRUCTION)
              else:
                  if cover_count or cover_instruction != "":
                      fail("COVER_UNEXPECTED")
                  instruction = ""
              validate_coverage(result, checked)
              body, _ = render_field(result, "text", checked)
              if e["format"] == "TELEGRAM_POST":
                  token = "[ПОСИЛАННЯ]"
                  if e["includeLink"] and token not in body:
                      body += ("\n\n" if body else "") + token
                  elif not e["includeLink"] and token in body:
                      fail("UNREQUESTED_LINK_PLACEHOLDER")
              if utf16_len(body) > MAX_BODY_UTF16[e["format"]]:
                  fail("OUTPUT_TEXT_LIMIT")
              if e["format"] in COVER_FORMATS:
                  cover, _ = render_field(result, "cover", checked)
                  if utf16_len(cover) > MAX_COVER_TEXT_UTF16:
                      fail("COVER_TEXT_LIMIT")
              return result, instruction


          def normalize_script(raw_script: object, checked: dict) -> list[dict]:
              format_name = checked["input"]["format"]
              if format_name not in SCRIPT_FORMATS:
                  if raw_script is not None:
                      fail("SCRIPT_UNEXPECTED")
                  return []
              script = obj(raw_script, ("frames",), ("frames",))
              frames = rows(script["frames"], MAX_SCRIPT_FRAMES, minimum=1)
              result, seen_ids = [], set()
              aggregate_text = 0
              mapping_count = 0
              segment_count = 0
              factual = checked["input"]["contentMode"] == "FACTUAL"
              for frame in frames:
                  frame = obj(frame, ("id", "purpose", "segments", "visualHint", "transition"),
                              ("id", "purpose", "segments", "visualHint", "transition"))
                  frame_id = identifier(frame["id"])
                  if frame_id != str(uuid.UUID(frame_id)) or frame_id in seen_ids:
                      fail("SCRIPT_FRAME_ID")
                  seen_ids.add(frame_id)
                  purpose = text(frame["purpose"], MAX_SCRIPT_PURPOSE)
                  visual_hint = text(frame["visualHint"], MAX_SCRIPT_VISUAL_HINT)
                  transition = text(frame["transition"], MAX_SCRIPT_TRANSITION,
                                    empty=format_name not in STORY_FORMATS)
                  if format_name in STORY_FORMATS and not transition.strip():
                      fail("SCRIPT_TRANSITION_REQUIRED")
                  if format_name not in STORY_FORMATS and transition:
                      fail("SCRIPT_TRANSITION_UNEXPECTED")
                  segments = []
                  frame_length = 0
                  for segment in rows(frame["segments"], MAX_SCRIPT_MAPPINGS, minimum=1):
                      segment = obj(segment, ("text", "claimRevisionId", "evidenceId"),
                                    ("text", "claimRevisionId", "evidenceId"))
                      value = text(segment["text"], MAX_SCRIPT_FRAME_TEXT_UTF16)
                      cid = text(segment["claimRevisionId"], 36, empty=True)
                      eid = text(segment["evidenceId"], 36, empty=True)
                      if factual:
                          if not cid or not eid or eid not in checked["allowed"].get(cid, set()):
                              fail("SCRIPT_EVIDENCE_REFERENCE")
                      elif cid or eid:
                          fail("SCRIPT_CREATIVE_MAPPING")
                      segment_count += 1
                      if segment_count > MAX_SCRIPT_MAPPINGS:
                          fail("SCRIPT_SEGMENT_LIMIT")
                      frame_length += utf16_len(value)
                      if frame_length > MAX_SCRIPT_FRAME_TEXT_UTF16:
                          fail("SCRIPT_FRAME_TEXT_LIMIT")
                      segments.append({"text": value, "claimRevisionId": cid, "evidenceId": eid})
                      if factual:
                          mapping_count += 1
                          if mapping_count > MAX_SCRIPT_MAPPINGS:
                              fail("SCRIPT_MAPPING_LIMIT")
                  aggregate_text += frame_length
                  if aggregate_text > MAX_SCRIPT_TEXT_UTF16:
                      fail("SCRIPT_TEXT_LIMIT")
                  result.append({"id": frame_id, "purpose": purpose, "segments": segments,
                                 "visualHint": visual_hint, "transition": transition})
              return result


          def render_script(frames: list[dict], checked: dict) -> dict | None:
              if not frames:
                  return None
              factual = checked["input"]["contentMode"] == "FACTUAL"
              result = []
              for frame in frames:
                  pieces, mappings = [], []
                  offset = 0
                  for segment in frame["segments"]:
                      value = segment["text"]
                      start, end = offset, offset + utf16_len(value)
                      pieces.append(value)
                      offset = end
                      if factual:
                          mappings.append({"startOffset": start, "endOffset": end, "quote": value,
                                           "claimRevisionId": segment["claimRevisionId"],
                                           "evidenceId": segment["evidenceId"]})
                  result.append({"id": frame["id"], "purpose": frame["purpose"], "text": "".join(pieces),
                                 "visualHint": frame["visualHint"], "transition": frame["transition"],
                                 "mappings": mappings})
              script = {"frames": result}
              if len(dumps(script).encode("utf-8")) > MAX_SCRIPT_BYTES:
                  fail("SCRIPT_SIZE")
              return script


          def validate_coverage(paragraphs: list[dict], checked: dict) -> None:
              if checked["input"]["contentMode"] != "FACTUAL":
                  return
              covered = {segment["claimRevisionId"] for paragraph in paragraphs if paragraph["field"] == "text"
                         for segment in paragraph["segments"]}
              if set(checked["required"]) - covered:
                  fail("REQUIRED_CLAIM_COVERAGE")
              if not covered:
                  fail("FACTUAL_EMPTY")


          def paragraph_text(paragraph: dict) -> str:
              return "".join(segment["text"] for segment in paragraph["segments"])


          def render_field(paragraphs: list[dict], field: str, checked: dict) -> tuple[str, list[dict]]:
              pieces, mappings = [], []
              offset = 0
              factual = checked["input"]["contentMode"] == "FACTUAL"
              for paragraph in paragraphs:
                  if paragraph["field"] != field:
                      continue
                  if pieces:
                      pieces.append("\n\n")
                      offset += 2
                  for segment in paragraph["segments"]:
                      value = segment["text"]
                      start = offset
                      end = start + utf16_len(value)
                      if factual:
                          mapping = {"startOffset": start, "endOffset": end, "quote": value,
                                     "claimRevisionId": segment["claimRevisionId"],
                                     "evidenceId": segment["evidenceId"]}
                          if field == "cover":
                              mapping["field"] = "cover"
                          mappings.append(mapping)
                      pieces.append(value)
                      offset = end
              return "".join(pieces), mappings


          def candidate_output(paragraphs: list[dict], cover_instruction: str, checked: dict,
                               script_frames: list[dict]) -> dict:
              e = checked["input"]
              body, mappings = render_field(paragraphs, "text", checked)
              if e["format"] == "TELEGRAM_POST":
                  token = "[ПОСИЛАННЯ]"
                  if e["includeLink"] and token not in body:
                      body += ("\n\n" if body else "") + token
                  elif not e["includeLink"] and token in body:
                      fail("UNREQUESTED_LINK_PLACEHOLDER")
              if utf16_len(body) > MAX_BODY_UTF16[e["format"]]:
                  fail("OUTPUT_TEXT_LIMIT")
              content = {"text": body, "mappings": mappings}
              if e["format"] in COVER_FORMATS:
                  cover, cover_mappings = render_field(paragraphs, "cover", checked)
                  if utf16_len(cover) > MAX_COVER_TEXT_UTF16:
                      fail("COVER_TEXT_LIMIT")
                  content["mappings"].extend(cover_mappings)
                  content["cover"] = {"text": cover, "instruction": cover_instruction}
              if len(content["mappings"]) > 100:
                  fail("MAPPING_LIMIT")
              output = {"schemaVersion": "adaptation-v1", "format": e["format"], "content": content}
              script = render_script(script_frames, checked)
              if e["format"] in SCRIPT_FORMATS:
                  if script is None:
                      fail("SCRIPT_REQUIRED")
                  output["script"] = script
              elif script is not None:
                  fail("SCRIPT_UNEXPECTED")
              return output


          def safe_reason(value: object) -> str:
              return text(value, 500)


          def validate_review(raw: object, paragraphs: list[dict], cover_instruction: str,
                              script_frames: list[dict]) -> dict:
              review = obj(load(raw), ("status", "reasons", "issues"), ("status", "reasons", "issues"))
              if review["status"] not in ("ready", "needs_human", "insufficient_evidence"):
                  fail("REVIEW_STATUS")
              reasons = [safe_reason(value) for value in rows(review["reasons"], 10)]
              indexes = {paragraph["paragraphId"]: paragraph_text(paragraph) for paragraph in paragraphs}
              if cover_instruction:
                  indexes["coverInstruction"] = cover_instruction
              indexes.update({"frame:" + frame["id"]: "".join(segment["text"] for segment in frame["segments"])
                              for frame in script_frames})
              issues = []
              seen = set()
              for issue in rows(review["issues"], MAX_ISSUES):
                  issue = obj(issue, ("severity", "category", "paragraphId", "quote", "instruction"),
                              ("severity", "category", "paragraphId", "quote", "instruction"))
                  if issue["severity"] not in ("critical", "major", "minor"):
                      fail("ISSUE_SEVERITY")
                  category = text(issue["category"], 60)
                  pid = text(issue["paragraphId"], 50)
                  quote = text(issue["quote"], 1000)
                  instruction = text(issue["instruction"], 1000)
                  if pid not in indexes or quote not in indexes[pid]:
                      fail("ISSUE_LOCATOR")
                  key = (pid, quote, category)
                  if key in seen:
                      fail("DUPLICATE_ISSUE")
                  seen.add(key)
                  issues.append({"severity": issue["severity"], "category": category, "paragraphId": pid,
                                 "quote": quote, "instruction": instruction})
              return {"status": review["status"], "reasons": reasons, "issues": issues}


          def serious(review: dict) -> bool:
              return any(issue["severity"] in ("critical", "major") for issue in review["issues"])


          def review_outcome(review: dict, *, repaired: bool) -> tuple[str, bool]:
              if review["status"] == "insufficient_evidence":
                  return "insufficient_evidence", False
              if review["status"] == "ready" and not serious(review):
                  return "ready", False
              if not repaired and review["issues"]:
                  return "running", True
              return "needs_human", False


          def report(state: dict) -> dict:
              final = state.get("finalOutput")
              return {"schemaVersion": REPORT_SCHEMA, "status": state["status"],
                      "contentHash": digest_output(final) if state["status"] == "ready" and final is not None else None,
                      "validation": state.get("validation", {}), "reasons": state.get("reasons", [])}


          def base_result(state: dict, *, request: dict | None = None, repair_required: int = 0) -> dict:
              final = report(state)
              output_json = dumps(state["finalOutput"]) if state["status"] == "ready" and state.get("finalOutput") is not None else ""
              report_json = dumps(final)
              if len(output_json.encode("utf-8")) > MAX_OUTPUT_BYTES or len(report_json.encode("utf-8")) > MAX_OUTPUT_BYTES:
                  fail("OUTPUT_SIZE")
              request_value = request or {}
              if len(dumps(state).encode("utf-8")) > MAX_CODE_OUTPUT_BYTES \
                      or len(dumps(request_value).encode("utf-8")) > MAX_CODE_OUTPUT_BYTES:
                  fail("CODE_OUTPUT_SIZE")
              return {"state": state, "request": request_value, "repair_required": repair_required,
                      "status": state["status"], "adaptation_json": output_json, "adaptation_report": report_json}


          def model_input(checked: dict) -> dict:
              e = checked["input"]
              return {"format": e["format"], "inputMode": e["inputMode"], "contentMode": e["contentMode"],
                      "includeLink": e["includeLink"], "brief": e["brief"], "style": e["style"], "claims": e["claims"],
                      "context": e["context"], "article": e["article"], "requiredClaimRevisionIds": checked["required"]}


          def generation_task(format_name: str) -> str:
              tasks = {
                  "TELEGRAM_POST": "Write one concise standalone Telegram post.",
                  "LINKEDIN_TEXT": "Write one polished LinkedIn text-only publication with a clear professional opening and useful body.",
                  "LINKEDIN_COVER": "Write the LinkedIn publication body and a short cover headline with a separate visual instruction for a designer.",
                  "INSTAGRAM_COVER": "Write the Instagram publication caption and a short cover headline with a separate visual instruction for a designer.",
                  "LINKEDIN_CAROUSEL": "Write a LinkedIn caption and a complete ordered carousel frame script.",
                  "INSTAGRAM_CAROUSEL": "Write an Instagram caption and a complete ordered carousel frame script.",
                  "INSTAGRAM_STORIES": "Write an Instagram caption and an ordered Stories frame script with transitions.",
              }
              return tasks[format_name]


          def runtime_main(operation: str, payload_json: str) -> str:
              payload = obj(load(payload_json))
              state = load(payload.get("state", {})) or {}

              if operation == "prepare":
                  checked = validate_input(payload.get("editorial_json"))
                  source = model_input(checked)
                  state = {"schemaVersion": "adaptation-state-v1", "paragraphs": [], "scriptFrames": [],
                           "coverInstruction": "", "review": None, "repairCount": 0, "reviewCount": 0,
                           "status": "running", "reasons": [], "validation": {}}
                  script_rules = {"required": source["format"] in SCRIPT_FORMATS,
                      "maxFrames": MAX_SCRIPT_FRAMES, "maxFrameTextUtf16": MAX_SCRIPT_FRAME_TEXT_UTF16,
                      "maxTotalTextUtf16": MAX_SCRIPT_TEXT_UTF16, "maxMappings": MAX_SCRIPT_MAPPINGS,
                      "maxPurposeChars": MAX_SCRIPT_PURPOSE, "maxVisualHintChars": MAX_SCRIPT_VISUAL_HINT,
                      "maxTransitionChars": MAX_SCRIPT_TRANSITION,
                      "transitionRequired": source["format"] in STORY_FORMATS}
                  request = {**source, "task": generation_task(source["format"]),
                             "outputRules": {"textLimitUtf16": MAX_BODY_UTF16[source["format"]],
                                 "coverTextLimitUtf16": MAX_COVER_TEXT_UTF16 if source["format"] in COVER_FORMATS else 0,
                                 "coverInstructionLimit": MAX_COVER_INSTRUCTION if source["format"] in COVER_FORMATS else 0,
                                 "script": script_rules}}
                  return dumps({"result": base_result(state, request=request)})

              if operation == "draft":
                  checked = validate_input(payload.get("editorial_json"))
                  if state.get("schemaVersion") != "adaptation-state-v1":
                      fail("STATE_CONTRACT")
                  try:
                      raw = obj(load(payload.get("raw")), ("paragraphs", "coverInstruction"),
                                ("paragraphs", "coverInstruction", "script"))
                      paragraphs, cover_instruction = normalize_paragraphs(raw["paragraphs"], raw["coverInstruction"], checked)
                      script_frames = normalize_script(raw.get("script"), checked)
                  except ValueError as exc:
                      code = str(exc).replace("ADAPTATION_WORKFLOW_", "")[:80]
                      state["paragraphs"] = []
                      state["scriptFrames"] = []
                      state["coverInstruction"] = ""
                      state["status"] = "needs_human"
                      state["reasons"] = ["The generated candidate failed deterministic validation."]
                      state["validation"] = {"format": checked["input"]["format"], "inputMode": checked["input"]["inputMode"],
                          "contentMode": checked["input"]["contentMode"], "includeLink": checked["input"]["includeLink"],
                          "requiredClaimRevisionIds": checked["required"], "repairCount": 0, "reviewCount": 0,
                          "candidateValidationError": code}
                      return dumps({"result": base_result(state)})
                  state["paragraphs"] = paragraphs
                  state["scriptFrames"] = script_frames
                  state["coverInstruction"] = cover_instruction
                  body_covered = sorted({s["claimRevisionId"] for p in paragraphs if p["field"] == "text"
                                         for s in p["segments"] if s["claimRevisionId"]})
                  state["validation"] = {"format": checked["input"]["format"], "inputMode": checked["input"]["inputMode"],
                      "contentMode": checked["input"]["contentMode"], "includeLink": checked["input"]["includeLink"],
                      "requiredClaimRevisionIds": checked["required"], "coveredClaimRevisionIds": body_covered,
                      "repairCount": 0, "reviewCount": 0}
                  return dumps({"result": base_result(state)})

              if operation == "review_request":
                  if state.get("status") != "running":
                      return dumps({"result": base_result(state)})
                  checked = validate_input(payload.get("editorial_json"))
                  candidate = candidate_output(state.get("paragraphs", []), state.get("coverInstruction", ""), checked,
                                               state.get("scriptFrames", []))
                  request = {"input": model_input(checked), "candidate": candidate,
                             "paragraphs": state["paragraphs"], "coverInstruction": state.get("coverInstruction", ""),
                             "scriptFrames": state.get("scriptFrames", []),
                             "reviewNumber": state.get("reviewCount", 0) + 1, "priorReview": state.get("review")}
                  return dumps({"result": base_result(state, request=request)})

              if operation == "review":
                  if state.get("status") != "running":
                      return dumps({"result": base_result(state)})
                  checked = validate_input(payload.get("editorial_json"))
                  review = validate_review(payload.get("raw"), state.get("paragraphs", []),
                                           state.get("coverInstruction", ""), state.get("scriptFrames", []))
                  state["review"] = review
                  state["reviewCount"] = state.get("reviewCount", 0) + 1
                  repaired = state.get("repairCount", 0) > 0
                  status, needs_repair = review_outcome(review, repaired=repaired)
                  state["status"] = status
                  state["reasons"] = review["reasons"] or [i["instruction"] for i in review["issues"][:5]]
                  state["validation"].update({"reviewCount": state["reviewCount"], "repairCount": state.get("repairCount", 0),
                                              "finalReviewStatus": review["status"], "issueCount": len(review["issues"])})
                  targets = sorted({issue["paragraphId"] for issue in review["issues"]})
                  request = {"input": model_input(checked), "paragraphs": state["paragraphs"],
                             "scriptFrames": state.get("scriptFrames", []),
                             "coverInstruction": state.get("coverInstruction", ""), "issues": review["issues"],
                             "allowedParagraphIds": [target for target in targets if not target.startswith("frame:")],
                             "allowedFrameIds": [target[6:] for target in targets if target.startswith("frame:")]} if needs_repair else {}
                  return dumps({"result": base_result(state, request=request, repair_required=int(needs_repair))})

              if operation == "patch":
                  checked = validate_input(payload.get("editorial_json"))
                  review = state.get("review") or {}
                  targets = sorted({issue["paragraphId"] for issue in review.get("issues", [])})
                  try:
                      patch = obj(load(payload.get("raw")), ("replacements", "frameReplacements", "coverInstruction"),
                                  ("replacements", "frameReplacements", "coverInstruction"))
                      replacements = rows(patch["replacements"], MAX_PARAGRAPHS)
                      replacement_map = {}
                      for item in replacements:
                          item = obj(item, ("paragraphId", "segments"), ("paragraphId", "segments"))
                          pid = text(item["paragraphId"], 20)
                          if pid in replacement_map:
                              fail("PATCH_DUPLICATE")
                          replacement_map[pid] = item["segments"]
                      frame_targets = {target[6:] for target in targets if target.startswith("frame:")}
                      frame_replacements = rows(patch["frameReplacements"], MAX_SCRIPT_FRAMES)
                      frame_replacement_map = {}
                      for item in frame_replacements:
                          item = obj(item, ("frameId", "purpose", "segments", "visualHint", "transition"),
                                     ("frameId", "purpose", "segments", "visualHint", "transition"))
                          frame_id = identifier(item["frameId"])
                          if frame_id in frame_replacement_map:
                              fail("PATCH_DUPLICATE")
                          frame_replacement_map[frame_id] = item
                      paragraph_targets = {target for target in targets if target != "coverInstruction" and not target.startswith("frame:")}
                      if not targets or set(replacement_map) != paragraph_targets or set(frame_replacement_map) != frame_targets \
                              or ("coverInstruction" in targets) != (patch["coverInstruction"] != state.get("coverInstruction", "")):
                          fail("PATCH_SCOPE")
                      staged = []
                      for paragraph in state.get("paragraphs", []):
                          if paragraph["paragraphId"] in replacement_map:
                              staged.append({"field": paragraph["field"], "segments": replacement_map[paragraph["paragraphId"]]})
                          else:
                              staged.append({"field": paragraph["field"], "segments": copy.deepcopy(paragraph["segments"])})
                      paragraphs, cover_instruction = normalize_paragraphs(staged, patch["coverInstruction"], checked)
                      staged_frames = []
                      for frame in state.get("scriptFrames", []):
                          replacement = frame_replacement_map.get(frame["id"])
                          if replacement is None:
                              staged_frames.append(copy.deepcopy(frame))
                          else:
                              staged_frames.append({"id": frame["id"], "purpose": replacement["purpose"],
                                  "segments": replacement["segments"], "visualHint": replacement["visualHint"],
                                  "transition": replacement["transition"]})
                      script_frames = normalize_script({"frames": staged_frames} if checked["input"]["format"] in SCRIPT_FORMATS else None,
                                                       checked)
                      if [p["paragraphId"] for p in paragraphs] != [p["paragraphId"] for p in state["paragraphs"]]:
                          fail("PATCH_LOCATOR")
                      if [frame["id"] for frame in script_frames] != [frame["id"] for frame in state.get("scriptFrames", [])]:
                          fail("PATCH_FRAME_LOCATOR")
                      new_text = {p["paragraphId"]: paragraph_text(p) for p in paragraphs}
                      if any(new_text[pid] == paragraph_text(old) for pid, old in
                             ((p["paragraphId"], p) for p in state["paragraphs"] if p["paragraphId"] in replacement_map)):
                          fail("PATCH_NO_PROGRESS")
                      old_frames = {frame["id"]: frame for frame in state.get("scriptFrames", [])}
                      new_frames = {frame["id"]: frame for frame in script_frames}
                      if any(new_frames[frame_id] == old_frames[frame_id] for frame_id in frame_targets):
                          fail("PATCH_NO_PROGRESS")
                      if "coverInstruction" in targets and cover_instruction == state.get("coverInstruction", ""):
                          fail("PATCH_NO_PROGRESS")
                      state["paragraphs"] = paragraphs
                      state["scriptFrames"] = script_frames
                      state["coverInstruction"] = cover_instruction
                      state["repairCount"] = 1
                      state["validation"].update({"repairCount": 1})
                      state["status"] = "running"
                  except ValueError as exc:
                      state["paragraphs"] = []
                      state["scriptFrames"] = []
                      state["coverInstruction"] = ""
                      state["status"] = "needs_human"
                      state["reasons"] = ["The single targeted repair was invalid or made no progress."]
                      state["validation"].update({"repairCount": 1, "repairError": str(exc).replace("ADAPTATION_WORKFLOW_", "")[:80]})
                      state["repairCount"] = 1
                  return dumps({"result": base_result(state)})

              if operation == "finalize":
                  checked = validate_input(payload.get("editorial_json"))
                  final = None
                  if state.get("status") == "ready":
                      try:
                          validate_coverage(state.get("paragraphs", []), checked)
                          output = candidate_output(state.get("paragraphs", []), state.get("coverInstruction", ""), checked,
                                                    state.get("scriptFrames", []))
                          review = state.get("review") or {}
                          if review.get("status") != "ready" or serious(review) or state.get("reviewCount") not in (1, 2):
                              fail("FINAL_REVIEW")
                          final = output
                      except ValueError as exc:
                          state["status"] = "needs_human"
                          state["reasons"] = ["The deterministic final validation did not pass."]
                          state["validation"].update({"finalValidationError": str(exc).replace("ADAPTATION_WORKFLOW_", "")[:80]})
                  if final is not None:
                      state["finalOutput"] = final
                      state["validation"].update({"outputSchemaVersion": "adaptation-v1",
                          "utf16Length": utf16_len(final["content"]["text"]),
                          "mappingCount": len(final["content"]["mappings"]),
                          "scriptFrameCount": len(final.get("script", {}).get("frames", [])),
                          "scriptMappingCount": sum(len(frame["mappings"]) for frame in final.get("script", {}).get("frames", [])),
                          "coveredClaimRevisionIds": sorted({m["claimRevisionId"] for m in final["content"]["mappings"]
                                                             if m.get("field", "text") == "text"}),
                          "factualMappingsVerified": checked["input"]["contentMode"] == "FACTUAL",
                          "creativeUnverified": checked["input"]["contentMode"] == "CREATIVE"})
                  else:
                      state["finalOutput"] = None
                      if state.get("status") == "running":
                          state["status"] = "needs_human"
                          state["reasons"] = ["Editorial review did not clear the candidate."]
                  return dumps({"result": base_result(state)})

              fail("OPERATION")


