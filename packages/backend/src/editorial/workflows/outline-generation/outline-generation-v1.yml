              revision_key, maximum = ("strategyRevisions", 1) if state["phase"] == "strategy" else ("outlineRevisions", 2)
              if not significant:
                  state["mode"], state["decisionHash"] = "pass", version(state)
                  if state["phase"] == "outline":
                      state["status"] = "ready"
              elif state[revision_key] >= maximum:
