    - data:
        code: |
          import json

          def main(editorial_json, state_json, model_json):
              result = json.loads(runtime_main('review', json.dumps({'editorial_json': editorial_json, 'state_json': state_json, 'model_json': model_json, 'scope': 'grounding'}, ensure_ascii=False))['result_json'])
              def encode(value):
                  text = json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(',', ':'))
                  if len(text.encode('utf-8')) > 350000:
                      raise ValueError('OUTLINE_CODE_OUTPUT_LIMIT')
                  return text
              return {
                  'state_json': encode(result['state']),
                  'request_json': encode(result.get('request', {})),
                  'done': int(result.get('done', 0)),
                  'status': result.get('status', result['state'].get('status', 'running')),
                  'mode': result.get('mode', result['state'].get('mode', 'draft')),
                  'outline_json': encode(result['outline_json']) if result.get('outline_json') is not None else '',
                  'outline_report': encode(result['outline_report']) if result.get('outline_report') is not None else '',
              }

          """Bounded, provider-free runtime for a reviewed outline candidate.

          Model reviews assess meaning; deterministic checks protect frozen references,
          revision coverage and targeted edits. This module never grants approval.
          """
          import copy
          import hashlib
          import json
          import re
          import uuid

          MAX_BYTES = 350000
          MAX_CALLS = 16
          SIGNIFICANT = {"critical", "major"}
          STRATEGY_FIELDS = ("readerNeed", "angle", "promise", "narrativeLogic", "exclusions")
          SECTION_FIELDS = ("sectionId", "title", "purpose", "keyMessage", "readerQuestion", "claimRevisionIds", "targetWords", "transition")


          def fail(code):
              raise ValueError("OUTLINE_WORKFLOW_" + code)


          def dumps(value):
              return json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":"), allow_nan=False)


          def digest(value):
              return hashlib.sha256(dumps(value).encode("utf-8")).hexdigest()


          def load(value):
              if not isinstance(value, str):
                  return copy.deepcopy(value)
              # The entry-point envelope carries several independently bounded JSON
              # strings; its aggregate must not be mistaken for one Code-node string.
              if len(value.encode("utf-8")) > 2 * 1024 * 1024:
                  fail("JSON_SIZE")
              def pairs(rows):
                  result = {}
                  for key, child in rows:
                      if key in result:
                          fail("DUPLICATE_KEY")
                      result[key] = child
                  return result
              try:
                  return json.loads(value, object_pairs_hook=pairs, parse_constant=lambda _: fail("JSON_NUMBER"))
              except (json.JSONDecodeError, RecursionError):
                  fail("JSON_INVALID")


          def size(value, maximum=MAX_BYTES):
              if len(dumps(value).encode("utf-8")) > maximum:
