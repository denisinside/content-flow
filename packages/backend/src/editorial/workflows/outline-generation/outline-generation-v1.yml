                      maxLength: 20
                      minLength: 1
                      type: string
                  required:
                  - issueId
                  - severity
                  - category
                  - targetId
                  - field
                  - quote
                  - instruction
                  - acceptance
                  type: object
                minItems: 0
                type: array
