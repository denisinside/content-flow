        context:
          enabled: false
          variable_selector: []
        desc: Structured Ukrainian editorial artifact; no tools or model retries.
        isInLoop: true
        loop_id: outline
        model:
          completion_params:
            code_execution: false
            grounding: false
            include_thoughts: false
            max_output_tokens: 8192
            media_resolution: Default
            service_tier: standard
            thinking_level: Low
            url_context: false
          mode: chat
          name: gemini-3.8-flash
          provider: langgenius/gemini/google
        prompt_config:
          jinja2_variables:
