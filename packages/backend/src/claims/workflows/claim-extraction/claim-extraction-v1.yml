          role: user
          text: |-
            <editorial_request>
            {{ request_json }}
            </editorial_request>
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 3000
        selected: false
        structured_output:
          schema:
            additionalProperties: false
            properties:
              conflicts:
                description: Return at most 100 items.
                items:
