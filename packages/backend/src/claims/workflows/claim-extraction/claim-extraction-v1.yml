                maxLength: 64
                minLength: 64
                type: string
            required:
            - versionHash
            - conflicts
            type: object
        structured_output_enabled: true
        title: Conflict reviewer
        type: llm
        vision:
          enabled: false
      height: 160
      id: conflict-reviewer
      position:
        x: 6820
        y: 200
      positionAbsolute:
        x: 6820
        y: 200
