app:
  description: Query-specific, bounded relevance ranking over exact frozen source passages. The server validates every decision; no claim extraction or approval.
  icon: book_open
  icon_background: '#D1E9FF'
  icon_type: emoji
  mode: workflow
  name: contentflow-source-relevance-v1
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      enabled: false
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
