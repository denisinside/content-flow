name: foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pinned package manager
        run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm env:init
      - run: pnpm deps:test:up
      # Local planning/configuration folders are intentionally excluded by .gitignore.
      - run: pnpm db:migrate:test && pnpm lint && pnpm typecheck && pnpm test:unit && pnpm build && pnpm verify:prisma
      - name: Verify canonical documentation when included in the checkout
        if: hashFiles('docs/STATUS.md') != ''
        run: pnpm verify:bootstrap
      - run: pnpm test:integration
      - run: pnpm verify:migrations
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: "true"
      - name: Stop isolated services
        if: always()
        run: docker compose --env-file .env -f infra/compose.dev.yml --profile test down
